name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repository must stay credential-free
        run: |
          chmod +x scripts/check-no-secrets.sh
          ./scripts/check-no-secrets.sh
      - name: Shell scripts must parse
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: Workspace file must be valid JSON
        run: python3 -c "import json,sys; json.load(open('ai-remote.code-workspace')); print('code-workspace ok')"
